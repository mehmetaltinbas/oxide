# Builds the game on Mac and Windows for every push, and runs the checks.
#
# Development happens on a Mac, so without this there is no way to know the
# Windows build still compiles, let alone to test it. Each run leaves a
# downloadable binary for both platforms.
name: build

on:
    push:
        paths:
            - '**'
            - '.github/workflows/build.yml'
    pull_request:
        paths:
            - '**'
    workflow_dispatch:

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      name: mac
                    - os: windows-latest
                      name: windows
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            # SDL is built from source, which is minutes. Keeping it between runs
            # turns most builds into seconds.
            - name: Cache the fetched libraries
              uses: actions/cache@v4
              with:
                  path: build/_deps
                  key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}

            - name: Configure
              run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

            - name: Build
              run: cmake --build build --config Release --parallel

            # The checks drive the real rules and assert on real state. They
            # need no window, so they run on both machines.
            - name: Run the checks
              run: |
                  ./build/bin/play_check
                  ./build/bin/island_check
                  ./build/bin/sound_check
              shell: bash

            - name: Collect the binaries
              uses: actions/upload-artifact@v4
              with:
                  name: oxide-${{ matrix.name }}
                  path: |
                      build/bin/*
                      !build/bin/*.dSYM
